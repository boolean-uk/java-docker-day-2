version: '3.8'
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: ${DB_PW}
    ports:
      - "5432:5432"
    volumes:
      - db_vol:/var/lib/postgresql/data

  app:
    image: cinema
    depends_on:
      - db
    environment:
      DB_URL : jdbc:postgresql://db:5432/postgres
      DB_PW : ${DB_PW}
      DB_USERNAME : ${DB_USERNAME}
    ports:
      - "4000:4000"
volumes:
  db_vol:
